<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Prediction and correction</title><desc id="d">The client shows a block on the tick it lands on screen. The input travels tagged with that view tick. The server grades it with the same function and sends its answer, which replaces the client&#x27;s only where they differ.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="2" height="2" fill="#e7dece"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f95"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e6514"/></marker></defs><rect x="1" y="1" width="958" height="428" rx="12" fill="#f5efe4" stroke="#d8cdb9" stroke-width="1.5"/><rect x="1" y="1" width="958" height="428" rx="12" fill="url(#dots)"/><text x="32" y="44" font-size="20" font-weight="600" fill="#1d2228" text-anchor="start">One timed block, client and server</text><text x="32" y="68" font-size="14" font-weight="400" fill="#55606b" text-anchor="start">Time runs left to right. Both sides run the same judging function.</text><text x="32" y="140" font-size="14" font-weight="600" fill="#1d2228" text-anchor="start">Client</text><text x="32" y="270" font-size="14" font-weight="600" fill="#1d2228" text-anchor="start">Server</text><path d="M110,135 L920,135" fill="none" stroke="#8a8f95" stroke-width="1.6" stroke-dasharray="5 5"/><path d="M110,265 L920,265" fill="none" stroke="#8a8f95" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="120" y="100" width="250" height="72" rx="8" fill="#f1e3c8" stroke="#9e6514" stroke-width="1.5"/><text x="134" y="124" font-size="15" font-weight="600" fill="#9e6514" text-anchor="start">1. Press, judged locally</text><text x="134" y="145" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">shown on the view tick</text><rect x="390" y="230" width="250" height="72" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="404" y="254" font-size="15" font-weight="600" fill="#1d2228" text-anchor="start">2. Graded on the view tick</text><text x="404" y="275" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">with the same function</text><rect x="660" y="100" width="260" height="72" rx="8" fill="#f1e3c8" stroke="#9e6514" stroke-width="1.5"/><text x="674" y="124" font-size="15" font-weight="600" fill="#9e6514" text-anchor="start">3. Kept if it agrees</text><text x="674" y="145" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">replaced if it does not</text><path d="M300,172 L300,200 L450,200 L450,230" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><text x="310" y="194" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">input tagged with the view tick</text><path d="M580,230 L580,200 L740,200 L740,172" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><text x="588" y="222" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">snapshot with the answer</text><path d="M120,340 L920,340" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><text x="920" y="326" font-size="12" font-weight="400" fill="#55606b" text-anchor="end">time</text><text x="32" y="386" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">They should disagree only when a packet was lost.</text><text x="32" y="406" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">A bot test counts what was shown against what was given.</text></svg>
