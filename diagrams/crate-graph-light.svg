<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Errastra engine crates</title><desc id="d">The workspace crates and the direction they depend on each other. An arrow points from a crate to a crate that uses it. The simulation crate, where the rules live, is marked.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="2" height="2" fill="#e7dece"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f95"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e6514"/></marker></defs><rect x="1" y="1" width="958" height="598" rx="12" fill="#f5efe4" stroke="#d8cdb9" stroke-width="1.5"/><rect x="1" y="1" width="958" height="598" rx="12" fill="url(#dots)"/><text x="32" y="44" font-size="20" font-weight="600" fill="#1d2228" text-anchor="start">Crate dependencies</text><text x="32" y="68" font-size="14" font-weight="400" fill="#55606b" text-anchor="start">An arrow points from a crate to the crate that uses it.</text><rect x="384.0" y="100" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="450" y="126" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">core</text><rect x="304.0" y="172" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="370" y="198" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">content</text><rect x="714.0" y="172" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="780" y="198" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">net</text><rect x="304.0" y="244" width="132" height="40" rx="8" fill="#f1e3c8" stroke="#9e6514" stroke-width="1.5"/><text x="370" y="270" font-size="15" font-weight="600" fill="#9e6514" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">sim</text><rect x="114.0" y="316" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="180" y="342" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">proto</text><path d="M180,356 L180,380" fill="none" stroke="#8a8f95" stroke-width="1.6"/><rect x="264.0" y="316" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="330" y="342" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">worldgen</text><path d="M330,356 L330,380" fill="none" stroke="#8a8f95" stroke-width="1.6"/><rect x="414.0" y="316" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="480" y="342" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">save</text><path d="M480,356 L480,380" fill="none" stroke="#8a8f95" stroke-width="1.6"/><rect x="564.0" y="316" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="630" y="342" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">replay</text><path d="M630,356 L630,380" fill="none" stroke="#8a8f95" stroke-width="1.6"/><path d="M450,140 L450,156 L370,156 L370,172" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M370,212 L370,244" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M370,284 L370,298" fill="none" stroke="#8a8f95" stroke-width="1.6"/><path d="M180,298 L630,298" fill="none" stroke="#8a8f95" stroke-width="1.6"/><path d="M180,298 L180,316" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M330,298 L330,316" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M480,298 L480,316" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M630,298 L630,316" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M180,380 L780,380" fill="none" stroke="#8a8f95" stroke-width="1.6"/><path d="M780,212 L780,380" fill="none" stroke="#8a8f95" stroke-width="1.6"/><text x="790" y="300" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">net joins the</text><text x="790" y="316" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">same feed</text><rect x="304.0" y="412" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="370" y="438" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">server</text><rect x="494.0" y="412" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="560" y="438" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">netclient</text><path d="M370,380 L370,412" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M560,380 L560,412" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><rect x="399.0" y="484" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="465" y="510" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">client</text><rect x="634.0" y="484" width="132" height="40" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="700" y="510" font-size="15" font-weight="600" fill="#1d2228" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">platform</text><path d="M370,452 L370,468 L440,468 L440,484" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M560,452 L560,468 L490,468 L490,484" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M634,504 L531,504" fill="none" stroke="#8a8f95" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="32" y="556" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Simplified: a crate may also use any crate above it. Amber marks where the rules live.</text><text x="32" y="578" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Beside the graph: bots (headless test clients), allocmeter (a counting allocator for benches) and x (the developer tool).</text></svg>
